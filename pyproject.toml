[tool.poetry]
name = "nvmesh"
version = "3.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

# NVIDIA combined PyPI (public mirror + nv-shared-pypi-local).
[[tool.poetry.source]]
name = "nv-shared"
url = "https://urm.nvidia.com/artifactory/api/pypi/nv-shared-pypi/simple"
priority = "primary"

[tool.poetry.group.pet.dependencies]
pyelftools = "^0.32"
pydantic = "^2.12.5"
kaitaistruct = "0.11"

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
confluent-kafka = "2.1.1"
ipython = "7.34.0"
pyyaml = "^6.0.2"
paramiko = "^3.5.0"
requests = "^2.32.5"
traitlets = "^5.14.3"
urllib3 = ">=2.6.3,<3"

[tool.poetry.group.compile]
optional = true

[tool.poetry.group.compile.dependencies]
pyinstaller = "^6.11.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
