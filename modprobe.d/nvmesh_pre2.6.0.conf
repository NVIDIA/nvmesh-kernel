##################################################################################
#Don't edit this file as it will be removed after nvmeshservice will be turned off
#use nvmesh_xyz.conf to overide/add module params
##################################################################################
install nvmeib_common_public  /sbin/modprobe --ignore-install `[ -f /etc/SuSE-release ] && echo "--allow-unsupported"` nvmeib_common_public ib_odp_info=`grep -c ib_umem_odp_get /proc/kallsyms 2> /dev/null || ( [ $? = 2 ] && echo -1 )` $CMDLINE_OPTS

# SoftiWARP Options
options siw mpa_crc_required=0 zcopy_tx=Y low_delay_tx=N

# Pre 2.6.0, Non-Bluefield configuration
options nvmeib_common pcpu_cq_all_cpus=N
options nvmeibc pcpu_cq_poll_proc=N nr_pcpu_channels_per_disk=0 nr_pcpu_ch_lockless=N nr_max_channels_per_path=4 lock_ch_2nd_ch_pcpu=0 use_pcpu_cq=N nr_pcpu_channels_per_disk=0 nr_max_channels_per_disk=64 io_max_retry_secs=0 disk_nrch_defer_block_cb=N disk_pause_at_first_discover=N use_async_subscribe=N
options nvmeibs use_pcpu_cq=N defer_process_io_cq=N

