##################################################################################
#Don't edit this file as it will be removed after nvmeshservice will be turned off
#use nvmesh_xyz.conf to overide/add module params
##################################################################################
install nvmeib_common_public /sbin/modprobe --ignore-install \
    `[ -f /etc/SuSE-release ] && echo "--allow-unsupported"` \
    nvmeib_common_public ib_odp_info=` \
    kernel_config="/boot/config-$(uname -r)"; \
    if [ ! -f "$kernel_config" ]; then \
        echo -1; \
    elif grep -q 'CONFIG_INFINIBAND_ON_DEMAND_PAGING=[y]' "$kernel_config"; then \
        echo 1; \
    else \
        echo 0; \
    fi`

# SoftiWARP Options
options siw mpa_crc_required=0 zcopy_tx=Y low_delay_tx=N
