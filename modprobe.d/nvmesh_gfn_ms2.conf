##################################################################################
#Don't edit this file as it will be removed after nvmeshservice will be turned off
#use nvmesh_xyz.conf to overide/add module params
##################################################################################
install nvmeib_common_public  /sbin/modprobe --ignore-install `[ -f /etc/SuSE-release ] && echo "--allow-unsupported"` nvmeib_common_public ib_odp_info=`grep -c ib_umem_odp_get /proc/kallsyms 2> /dev/null || ( [ $? = 2 ] && echo -1 )` $CMDLINE_OPTS

# SoftiWARP Options
options siw mpa_crc_required=0 zcopy_tx=Y low_delay_tx=N
options nvmeibc ib_net_complete_iocmd_use_pcpu_wq=Y disk_locks_use_system_pcpu_wq=Y  jam_use_system_pcpu_wq=Y nr_max_channels_per_path=0 nr_max_channels_per_disk=4 use_pcpu_cq=Y disk_coremask_support=Y disk_max_coremask_nrch=2 disk_use_coremask_pending=Y lock_ch_2nd_ch_pcpu_lockless=N lock_ch_2nd_ch_coremask=2 disk_local_use_system_pcpu_wq=Y ec_reuse_req=N
options nvmeib_common pcpu_cq_all_cpus=Y pcpu_cq_intr_budget=0 completion_noise_enabled=Y pcpu_process_cq_retry_usecs=5

