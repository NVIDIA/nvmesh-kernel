[tool.poetry]
name = "nvmesh-monitor"
version = "3.2.0"
description = ""
authors = ["Kobi Shpak <kobi@nvidia.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
pyyaml = "^6.0.2"
requests = "^2.32.3"
jmespath = "0.10.0"
prometheus-client = "0.23.1"
logbook = "1.8.0"
# Keep the CentOS 7 monitor build on a manylinux2014 wheel.
greenlet = "3.1.1"
nvmesh-infra = {path = "../../infrastructure"}

[tool.poetry.group.compile]
optional = true

[tool.poetry.group.compile.dependencies]
pyinstaller = "^6.11.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
