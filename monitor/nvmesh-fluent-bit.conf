# This conf should be included by adding the @INCLUDE to /etc/fluent-bit/fluent-bit.conf

[INPUT]
    # TCP listener for Syslog
    Name     syslog
    Tag      nvmesh-syslog
    Parser   syslog-rfc5424
    Listen   0.0.0.0
    Port     5140
    Mode     tcp

[INPUT]
    # TCP listener for Management Events
    Name     tcp
    Tag      nvmesh-events
    Listen   0.0.0.0
    Port     5170

[INPUT]
    # TCP listener for selected Binary Traces
    Name     tcp
    Tag      nvmesh-trace
    Listen   0.0.0.0
    Port     5171

[FILTER]
    # Filter to accept only selected syslogs.
    # TODO: This should really be done in the rsyslog forwarder
    name grep
    Regex ident (managementAgent|managementCM|testlog)
    Match nvmesh-syslog

[FILTER]
    # TCP input doesn't have Time_Key and anyway it's non-trivial
    # Only Lua let's us reset the timestamp, and using the Time_as_table avoids loss of precision
    Name lua
    Match_regex nvmesh-(trace|events)
    Call set_time
    time_as_table On
    Code function set_time(tag, timestamp, record) return 1, {sec=record["ts_sec"], nsec=record["ts_nano"]}, record end

#[OUTPUT]
#    # File output for debugging
#    Name file
#    mkdir on
#    Path /var/log/nvmesh/fluent-debug
#    Match nvmesh-*

[OUTPUT]
    # Opensearch feed
    Name  opensearch
    Match nvmesh-*
    Host  opensearch
    Port  9200
    HTTP_User admin
    HTTP_Passwd admin
    Index nvmesh_logs

    Include_Tag_key on
    # Trace_Output on
    # Trace_Error on

    # See: https://docs.fluentbit.io/manual/pipeline/outputs/tcp-and-tls
    tls On
    tls.verify Off

