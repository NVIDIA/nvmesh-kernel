---
# <source_pattern> - path/pattern to a local file or url
#     metric_prefix - metric name prefix
#     type - parser type. Supported: JsonProcParser (default), KeyValueProcParser, RestParser, CmdParser, UmRpcParser, UmRpcLvolParser, UmRpcOperationParser
#     per_node - [RestParser only] collect metric from each management node in the HA configuration separately
#     transform - jmespath query to transform raw output from source
#     glob_labels_re - extract label from glob re on source_pattern
#     pattern_labels_re - extract label from json KEYS re path (general scope)
#     query_labels - mapping of label name to extract label from json VALUES path in jmespath syntax, in case json is a list - use a query per item in the list
#         <label_name> - jmespath.to.value.of.metric
#     query_labels_re - extract multiple labels from a single field value using named regex groups
#         <field_name> - regex with named groups e.g. '(?P<label1>[^-]+)->(?P<label2>.+)'
#
#     metrics - list of specific metric lookups and definitions
#         <metric_name> - metric name
#             help - metric description
#             type - counter/gauge
#             pattern_labels_re - extract label from json KEYS re path
#
#     aggregates - list of metrics that will be generated by aggregation of values
#         <aggregate_name> - aggregate metric name
#             help - metric description
#             ignore - list of labels to ignore when aggregating
#             aggregate_by - mapping of label name to aggregation conf
#                 <label_name> - define label name
#                     query - jmespath query to aggregate by, will iterate over list objects to ensure single return
#             sum_by - jmespath query of the field to sum by. If not mentioned, aggregate will sum occurrences
#
#     collections - iterate over lists in raw data. collections can be nested for even more nested lists
#         <collection query> - query to iterates over new data structure
#         query_labels - will be used as keys for iterated nested items
#             <label_name> - jmespath.to.value.of.metric
#         <collections|metrics|aggregates>

bdev_lvol_get_lvstores:
  type: UmRpcParser
  metric_prefix: 'nvmesh_client_lvol_store'
  metrics:
    free_clusters:
      help: 'number of free clusters'
    total_data_clusters:
      help: 'total data clusters'

bdev_get_iostat:
  type: UmRpcLvolParser
  metric_prefix: 'nvmesh_client_lvol_io'
  transform: '{tick_rate: tick_rate, bdev: bdevs[0]}'
  glob_labels_re: '-b (?P<volume_name>\S+)'
  metrics:
    tick_rate:
      help: 'tick rate for rpc'
    size:
      pattern_labels_re: 'bdev_bytes_(?P<op>\w+)'
      help: 'lvol io stat size'
    latency:
      pattern_labels_re: 'bdev_(?P<op>\w+)_latency_ticks'
      help: 'lvol io stat latency'
    ops:
      pattern_labels_re: 'bdev_num_(?P<op>\w+)_ops'
      help: 'lvol io stat ops'


nvmesh_rpc_operation@volume@VOLUME_IO_STATS_SIZE:
  type: UmRpcOperationParser
  metric_prefix: 'nvmesh_client_volume_io'
  glob_labels_re: '--name (?P<volume_name>\S+) '
  metrics:
    size:
      pattern_labels_re: 'summary_chosen_cores_(?P<op>\w+)_bytes_(?P<io_size>\w+)_sum'
      help: 'IO stat for volume'
      type: 'counter'
    latency:
      pattern_labels_re: 'summary_chosen_cores_(?P<op>\w+)_latency_(?P<io_size>\w+)_sum'
      help: 'IO stat for volume'
      type: 'counter'
    ops:
      pattern_labels_re: 'summary_chosen_cores_(?P<op>\w+)_ops_(?P<io_size>\w+)_sum'
      help: 'IO stat for volume'
      type: 'counter'

nvmesh_rpc_operation@disk@DISK_IO_STATS_SIZE:
  type: UmRpcOperationParser
  metric_prefix: 'nvmesh_client_disks_io'
  glob_labels_re: '--name (?P<disk_sn>\S+) '
  metrics:
    size:
      pattern_labels_re: 'summary_chosen_cores_(?P<op>\w+)_bytes_(?P<io_size>\w+)_sum'
      help: 'IO size for disk by operation'
      type: 'counter'
    latency:
      pattern_labels_re: 'summary_chosen_cores_(?P<op>\w+)_latency_(?P<io_size>\w+)_sum'
      help: 'IO latency for disk by operation'
      type: 'counter'
    ops:
      pattern_labels_re: 'summary_chosen_cores_(?P<op>\w+)_ops_(?P<io_size>\w+)_sum'
      help: 'IO ops for disk by operation'
      type: 'counter'


nvmesh_rpc_operation@volume@VOLUME_DP_STATS:
  type: UmRpcOperationParser
  metric_prefix: 'nvmesh_client_volume_dp_stats'
  glob_labels_re: '--name (?P<volume_name>\S+) '
  metrics:
    err_bad_read_metadata_sum:
      pattern_labels_re: "summary_chosen_cores_err_bad_read_metadata_sum"
      help: "meta-data validation failed on read"
    err_bad_read_sectors_sum:
      pattern_labels_re: "summary_chosen_cores_err_bad_read_sectors_sum"
      help: "read failed"
    err_io_aborts_sum:
      pattern_labels_re: "summary_chosen_cores_err_io_aborts_sum"
      help: "IOs that were aborted (timeout)"
    err_io_failures_sum:
      pattern_labels_re: "summary_chosen_cores_err_io_failures_sum"
      help: "IOs that failed"
    err_stale_locks_sum:
      pattern_labels_re: "summary_chosen_cores_err_stale_locks_sum"
      help: "stale locks seen"
    err_sync_failures_sum:
      pattern_labels_re: "summary_chosen_cores_err_sync_failures_sum"
      help: "syncs that failed"
    io_inflight_sum:
      pattern_labels_re: "summary_chosen_cores_io_inflight_sum"
      help: "IOs inflight "
    io_pending_sum:
      pattern_labels_re: "summary_chosen_cores_io_pending_sum"
      help: "IOs pending (queued)"
    io_retries_sum:
      pattern_labels_re: "summary_chosen_cores_io_retries_sum"
      help: "IOs that were retried internally"
    sync_successes_sum:
      pattern_labels_re: "summary_chosen_cores_sync_successes_sum"
      help: "syncs that succeeded "
    syncs_active_sum:
      pattern_labels_re: "summary_chosen_cores_syncs_active_sum"
      help: "currently running syncs"

nvmesh_rpc_operation@volume@VOLUME_STATUS:
  type: UmRpcOperationParser
  metric_prefix: 'nvmesh_client_volume'
  query_labels:
    volume_uuid: 'uuid'
  glob_labels_re: '--name (?P<volume_name>\S+) '
  metrics:
    io_enabled:
      help: "is IO enabled"
    md_enabled:
      help: "is MD enabled"
  aggregates:
    segment_statuses:
      help: 'statuses of segments'
      aggregate_by:
        act:
          query: 'chunks[].praids[].topologies.active.segments[]."segment registered"'
        paused:
          query: 'chunks[].praids[].topologies.active.segments[].paused'

/getClusterStatus?skipLogs=true:
  metric_prefix: 'nvmesh_management_cluster'
  type: RestParser
  metrics:
    totalspace:
      help: 'cluster total space'
      type: 'gauge'
    allocatedspace:
      help: 'cluster allocated space'
      type: 'gauge'
    freespace:
      help: 'cluster free space'
      type: 'gauge'
    client_counters:
      help: 'cluster client counters'
      type: 'gauge'
      pattern_labels_re: 'clients_(?P<client_counter>\w+)'
    server_counters:
      help: 'cluster server counters'
      type: 'gauge'
      pattern_labels_re: 'servers_(?P<server_counter>\w+)'
    drive_counters:
      help: 'cluster drive counters'
      type: 'gauge'
      pattern_labels_re: 'drives_(?P<drive_counter>\w+)'
    volume_counters:
      help: 'cluster volume counters'
      type: 'gauge'
      pattern_labels_re: 'volumes_(?P<volume_counter>\w+)'

/managementCluster/all/0/0:
  metric_prefix: 'nvmesh_management_cluster'
  type: RestParser
  query_labels:
    management_version: 'managementVersion'
  aggregates:
    management_version:
      help: 'NVMesh management version'
      aggregate_by:
        hostname:
          query: 'hostname'

/managementCluster/all/0/0/:
  metric_prefix: 'nvmesh_management_cluster'
  type: RestParser
  per_node: true
  transform: "[?isMe != `true`]"
  query_labels:
    hostname: 'hostname'
  aggregates:
    outbound_socket_status:
      help: 'outbound socket status to management'
      aggregate_by:
        outbound_socket_status:
          query: 'outbound_socket_status'
    inbound_socket_status:
      help: 'inbound socket status to management'
      aggregate_by:
        inbound_socket_status:
          query: 'inbound_socket_status'

/logs/count:
  metric_prefix: 'nvmesh_management_logs'
  type: RestParser
  metrics:
    total:
      help: 'logs total'
      type: 'counter'

/logs/alerts/count:
  metric_prefix: 'nvmesh_management_logs_alerts'
  type: RestParser
  metrics:
    total:
      help: 'logs alerts total'
      type: 'counter'

/servers/all/0/0?projection={"nics.status":1}:
  metric_prefix: 'nvmesh_management_nics'
  type: RestParser
  aggregates:
    count_by_status:
      help: 'nics count by status'
      aggregate_by:
        nic_status:
          query: 'nics[].status'

/servers/all/0/0?projection={"nics.status":1,"nics.nicID":1,"rebuildStats":1}:
  metric_prefix: 'nvmesh_management'
  type: RestParser
  query_labels:
    server_name: '_id'
  metrics:
    toma_rebuild_stats:
      help: 'toma rebuild stats'
      pattern_labels_re: 'rebuildstats_(?P<rebuild_cntr>\w+)'
  collections:
    nics:
      query_labels:
        nic_id: 'nicID'
      aggregates:
        nic_status_by_id:
          help: 'nics status by nic id'
          aggregate_by:
            nic_status:
              query: 'status'

/clients/all/0/0?projection={"block_devices.vol_status":1,"block_devices.name":1}:
  metric_prefix: 'nvmesh_management_clients_attachments'
  type: RestParser
  query_labels:
    client_name: '_id'
  aggregates:
    by_volume_status_total:
      help: 'attachments by volume status total'
      aggregate_by:
        volume_status:
          query: 'block_devices[].vol_status'
  collections:
    block_devices:
      query_labels:
        volume_name: 'name'
      aggregates:
        status_by_name:
          help: 'attachments status by volume name'
          aggregate_by:
            volume_status:
              query: 'vol_status'

/volumes/all/0/0?projection={"RAIDLevel":1,"capacity":1}:
  metric_prefix: 'nvmesh_management_volumes'
  type: RestParser
  aggregates:
    by_raid_level_total: &volumes_by_raid_level_total
      help: 'volumes by raid level total'
      aggregate_by:
        raid_level:
          query: 'RAIDLevel'
    capacity_by_raid_level:
      <<: *volumes_by_raid_level_total
      help: 'volumes capacity sum by raid level'
      sum_by: 'capacity'

/volumes/all/0/0?projection={"health":1,"action":1,"status":1}:
  metric_prefix: 'nvmesh_management_volume'
  type: RestParser
  query_labels:
    volume_name: '_id'
  aggregates:
    health:
      help: 'volume health reported by management'
      aggregate_by:
        health:
          query: 'health'
    status:
      help: 'volume status reported by management'
      aggregate_by:
        status:
          query: 'status'
    action:
      help: 'volume action reported by management'
      aggregate_by:
        action:
          query: 'action'

/volumes/all/0/0?projection={"chunks.uuid":1,"chunks.pRaids.uuid":1,"chunks.pRaids.diskSegments.uuid":1,"chunks.pRaids.diskSegments.diskID":1,"chunks.pRaids.diskSegments.node_id":1,"chunks.pRaids.diskSegments.lbs":1,"chunks.pRaids.diskSegments.lbe":1}:
  metric_prefix: 'nvmesh_management_segment'
  type: RestParser
  query_labels:
    volume_name: '_id'
  collections:
    chunks:
      query_labels:
        chunk_uuid: uuid
      collections:
        pRaids:
          query_labels:
            praid_uuid: uuid
          collections:
            diskSegments:
              query_labels:
                segment_uuid: uuid
                disk_id: diskID
                node_id: node_id
              metrics:
                lbs:
                  help: 'segment lbs'
                lbe:
                  help: 'segment lbe'

/volumeProvisioningGroups/getVolumesCapacityUsage/all:
  metric_prefix: 'nvmesh_management_volume_provisioning_group'
  type: RestParser
  query_labels:
    vpg: 'VPG'
    allow_overflow: 'allowOverflow'
  metrics:
    allocatedcapacity:
      help: 'Allowed capacity by VPG in GB'
    freecapacity:
      help: 'Free capacity by VPG in GB'
    totalcapacity:
      help: 'Total capacity by VPG in GB'

/disks/all/0/0?projection={"disks.usableBlocks":1,"disks.block_size":1}&filter={"disks.isExcluded":false}:
  metric_prefix: 'nvmesh_management_disks'
  type: RestParser
  query_labels:
    server_name: '_id'
  aggregates:
    usable_blocks_by_server_total:
      help: 'usable blocks by server total'
      aggregate_by:
        block_size:
          query: 'disks.block_size'
      sum_by: 'disks.usableBlocks'

/aboutInfo:
  metric_prefix: 'nvmesh_management'
  type: RestParser
  per_node: true
  aggregates:
    is_alive:
      help: 'management node is alive'
      aggregate_by:
        management_version:
          query: managementVersion
        node_version:
          query: nodeVersion
        mongo_version:
          query: mongoVersion

