#      help: 'users total by role'
#      aggregate_by:
#        role:
#          query: 'role'

/proc/nvmeibc/volumes/*/iostats.json:
  metric_prefix: 'nvmesh_client_volume_io'
  glob_labels_re: '/proc/nvmeibc/volumes/(?P<volume_name>[_\-+=\w]+)/iostats.json'
  metrics:
    size:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_size_(?P<op>\w+)'
      help: 'IO size for volume by operation'
      type: 'counter'
    latency:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_latency_(?P<op>\w+)'
      help: 'IO latency for volume by operation'
      type: 'counter'
    ops:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_ops_(?P<op>\w+)'
      help: 'IO ops for volume by operation'
      type: 'counter'

/proc/nvmeibc/net/*/iostats.json:
  metric_prefix: 'nvmesh_client_nics_io'
  glob_labels_re: '/proc/nvmeibc/net/(?P<nic_guid>\w+)/iostats.json'
  metrics:
    size:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_size_(?P<op>\w+)'
      help: 'IO size for NIC by operation'
      type: 'counter'
    latency:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_latency_(?P<op>\w+)'
      help: 'IO latency for NIC by operation'
      type: 'counter'
    ops:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_ops_(?P<op>\w+)'
      help: 'IO ops for NIC by operation'
      type: 'counter'

/proc/nvmeibc/disks/*/iostats.json:
  metric_prefix: 'nvmesh_client_disks_io'
  glob_labels_re: '/proc/nvmeibc/disks/(?P<disk_sn>\w+(\.\d+)?)/iostats.json'
  metrics:
    size:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_size_(?P<op>\w+)'
      help: 'IO size for disk by operation'
      type: 'counter'
    latency:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_latency_(?P<op>\w+)'
      help: 'IO latency for disk by operation'
      type: 'counter'
    ops:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_ops_(?P<op>\w+)'
      help: 'IO ops for disk by operation'
      type: 'counter'

/proc/nvmeibs/disks/*/iostats.json:
  metric_prefix: 'nvmesh_target_disks_io'
  glob_labels_re: '/proc/nvmeibs/disks/(?P<disk_sn>\w+(\.\d+)?)/iostats.json'
  metrics:
    size:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_size_(?P<op>\w+)'
      help: 'IO size for disk by operation'
      type: 'counter'
    latency:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_latency_(?P<op>\w+)'
      help: 'IO latency for disk by operation'
      type: 'counter'
    ops:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_ops_(?P<op>\w+)'
      help: 'IO ops for disk by operation'
      type: 'counter'

/proc/nvmeibs/nic_stats/*/iostats.json:
  metric_prefix: 'nvmesh_target_nics_io'
  glob_labels_re: '/proc/nvmeibs/nic_stats/(?P<nic_guid>\w+)/iostats.json'
  metrics:
    size:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_size_(?P<op>\w+)'
      help: 'IO size for NIC by operation'
      type: 'counter'
    latency:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_latency_(?P<op>\w+)'
      help: 'IO latency for NIC by operation'
      type: 'counter'
    ops:
      pattern_labels_re: 'stats_(?P<io_size>\w+)_ops_(?P<op>\w+)'
      help: 'IO ops for NIC by operation'
      type: 'counter'

/proc/nvmeibc/disks/*/counters:
  type: KeyValueProcParser
  metric_prefix: 'nvmesh_client_disks_counter'
  glob_labels_re: '/proc/nvmeibc/disks/(?P<disk_sn>\w+(\.\d+)?)/counters'
  metrics:
    n:
      pattern_labels_re: 'n_(?P<cntr_lvl>\w+?)_(?P<cntr_name>\w+)'
      help: 'number of disks counter occurrences'
      type: 'counter'

/proc/nvmeibc/volumes/*//status.json:
  metric_prefix: 'nvmesh_client_volume'
  glob_labels_re: '/proc/nvmeibc/volumes/(?P<volume_name>[_\-+=\w]+)/status.json'
  query_labels:
    volume_uuid: 'uuid'
  metrics:
    io_enabled:
      help: "is IO enabled"

/proc/nvmeibc/volumes/*/status.json:
  metric_prefix: 'nvmesh_client_volume'
  glob_labels_re: '/proc/nvmeibc/volumes/(?P<volume_name>[_\-+=\w]+)/status.json'
  query_labels:
    volume_uuid: 'uuid'
    edic: 'dp_flags.edic'
    local_read: 'dp_flags.local_read'
    elev: 'dp_flags.elev'
    snake: 'dp_flags.snake'
    jent: 'dp_flags.jent'
    io_perm: 'topo.io_perm'
    can_view_lock: 'topo.can_view_lock'
  metrics:
    reservation_version:
      help: 'attachment reservation_version'
      type: 'counter'
    sync_stats:
      pattern_labels_re: 'sync_stas_(?P<sync_stat>\w+)'
      help: 'syncs statstics'
      type: 'gauge'
    failed_io:
      pattern_labels_re: 'failed_io_(?P<fail_type>\w+)'
      help: 'number of failed io by failure type'
      type: 'counter'
    resubmission:
      pattern_labels_re: 'resubmittion_(?P<resub_cntr>\w+)'
      help: 'number of resubmissions by type'
      type: 'counter'
    internal_err:
      pattern_labels_re: 'internal_err_(?P<internal_err_cntr>\w+)'
      help: 'number of internal errors by type'
      type: 'counter'
    num_slow_locks:
      pattern_labels_re: 'slow_locks_num_locks'
      help: 'num of slow locks'
      type: 'gauge'
  aggregates:
    attached_total: &att_stat
      help: 'number of attached volume'
      aggregate_by:
        io_state:
          query: 'status'
        visibility:
          query: 'type'
      ignore:
        - 'volume_name'
        - 'volume_uuid'
        - 'edic'
        - 'local_read'
        - 'elev'
        - 'snake'
        - 'jent'
        - 'io_perm'
        - 'can_view_lock'
    attach_status_per_volume:
      <<: *att_stat
      help: 'Attachment status per volume'
      ignore:
        - 'edic'
        - 'local_read'
        - 'elev'
        - 'snake'
        - 'jent'
        - 'io_perm'
        - 'can_view_lock'
    segment_statuses:
      help: 'statuses of segments'
      aggregate_by:
        act:
          query: 'topo.chunks[].prs[].segs[].act'
        paused:
          query: 'topo.chunks[].prs[].segs[].disk.paused'
      ignore:
        - 'edic'
        - 'local_read'
        - 'elev'
        - 'snake'
        - 'jent'
        - 'io_perm'
        - 'can_view_lock'

/proc/nvmeibs/toma_status/all.json:
  metric_prefix: nvmesh_toma
  metrics:
    raft_time_since_converted_to_leader:
      help: 'Time since converted to RAFT leader'
      type: 'counter'
    num_clients:
      help: 'Number of connected clients'
      type: 'gauge'
  aggregates:
    raft_leader_name:
      help: 'Raft leader name as seen by current TOMA'
      aggregate_by:
        raft_leader_name:
          query: 'RAFT.leader_name'

/proc/nvmeibs/toma_status//all.json:
  metric_prefix: nvmesh_toma_raft
  transform: 'RAFT.peer_members'
  query_labels:
    peer_member: 'member'
  metrics:
    time_since_voted_for_me_on_cur_term:
      help: 'Time since peer member voted for RAFT leader'
      type: 'counter'
    is_alive_for_topo:
      help: 'Peer member voted for RAFT leader withing topology'
      type: 'counter'
    topo_version:
      help: 'Topology version of peer member'
      type: 'counter'

/proc/nvmeibs/toma_status/nm.json:
  metric_prefix: 'nvmesh_toma_nw_status'
  aggregates:
    paths_by_state:
      help: 'network paths count by connection state'
      aggregate_by:
        path_state:
          query: 'nw_status.state.nics[].ports[].paths[].state'
        last_error:
          query: 'nw_status.state.nics[].ports[].paths[].last_error'
  collections:
    nw_status.state.remote_nodes:
      query_labels:
        node_id: 'name'
      metrics:
        connected:
          help: 'is node connected'
          type: 'counter'
    nw_status.state.nics:
      metric_prefix: 'nvmesh_toma_nw_nic'
      query_labels:
        nic_name: 'name'
      metrics:
        allowed:
          help: 'is NIC allowed for NVMesh traffic'
          type: 'gauge'
        alive:
          help: 'is NIC alive'
          type: 'gauge'
      collections:
        ports:
          metric_prefix: 'nvmesh_toma_nw_port'
          query_labels:
            port_num: 'port_num'
            gid: 'gid'
            port_state: 'state'
            port_type: 'type'
          metrics:
            usable:
              help: 'is port usable'
              type: 'gauge'
            alive:
              help: 'is port alive'
              type: 'gauge'
          collections:
            paths:
              metric_prefix: 'nvmesh_toma_nw_path'
              query_labels:
                path_state: 'state'
                last_error: 'last_error'
              query_labels_re:
                name: '(?P<local_addr>[^-]+)->(?P<remote_node>[^:]+):(?P<remote_addr>.+)'
              metrics:
                version:
                  help: 'path connection version'
                  type: 'gauge'
                counters_path_restarts:
                  help: 'total path restarts'
                  type: 'counter'
                counters_invalid_ping_response:
                  help: 'invalid ping responses'
                  type: 'counter'
                counters_ping_retries:
                  help: 'total ping retries on path'
                  type: 'counter'
                restart_reason:
                  pattern_labels_re: 'nvmesh_toma_nw_path_counters_path_restarts_counters_(?P<restart_reason>.+)'
                  help: 'path restarts by reason'
                  type: 'counter'

/proc/nvmeib*/memmgr_info:
  glob_labels_re: '/proc/(?P<module>\w+)/memmgr_info'
  metric_prefix: 'nvmesh_client_memmgr_info'
  transform: >-
    {version: version, metrics: ["metrics.all_cpus"][] | [?name=='memory.allocated'] }
  collections:
    metrics:
      query_labels_list:
        names: [ 'name', 'component' ]
        path: 'labels'
      metrics:
        value:
          help: "kernel module memory usage by module and component"
          type: "counter"
